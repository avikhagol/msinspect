[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msinspect"
version = "0.0.1"
description = "Inspect Measurement Sets gracefully"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-casacore", "rich", "textual"
]

[project.scripts]
msinspect = "msinspect:cli"